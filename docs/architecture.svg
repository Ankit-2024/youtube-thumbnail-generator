<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>YouTube Thumbnail Generator — AWS Architecture</title>
  <desc>Architecture diagram showing the full AWS stack: React frontend on S3 and CloudFront, API Gateway, Lambda orchestrator, Bedrock Claude Haiku and Stable Diffusion 3.5 Large, Pillow image processing, and S3 thumbnail storage.</desc>

  <!-- Background -->
  <rect width="1280" height="720" fill="#0a0a0a"/>

  <!-- Grid pattern -->
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="rgba(255,59,59,0.06)" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#666" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#FF3B3B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="url(#grid)"/>

  <!-- Title -->
  <text x="640" y="52" text-anchor="middle" font-family="'Bebas Neue', Arial Black, sans-serif" font-size="28" fill="#FF3B3B" letter-spacing="4">YOUTUBE THUMBNAIL GENERATOR</text>
  <text x="640" y="74" text-anchor="middle" font-family="monospace" font-size="11" fill="#444" letter-spacing="2">AWS SERVERLESS ARCHITECTURE</text>

  <!-- ── LAYER LABELS ── -->
  <text x="30" y="200" font-family="monospace" font-size="10" fill="#333" transform="rotate(-90,30,200)">FRONTEND</text>
  <text x="30" y="340" font-family="monospace" font-size="10" fill="#333" transform="rotate(-90,30,340)">GATEWAY</text>
  <text x="30" y="480" font-family="monospace" font-size="10" fill="#333" transform="rotate(-90,30,480)">COMPUTE</text>
  <text x="30" y="630" font-family="monospace" font-size="10" fill="#333" transform="rotate(-90,30,630)">STORAGE</text>

  <!-- ── ROW 1: USER + FRONTEND ── -->

  <!-- User -->
  <rect x="80" y="145" width="130" height="80" rx="8" fill="#111" stroke="#2a2a2a" stroke-width="1"/>
  <text x="145" y="178" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#f0f0f0">User</text>
  <text x="145" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">Browser</text>

  <!-- S3 + CloudFront -->
  <rect x="280" y="110" width="200" height="72" rx="8" fill="#0d2a1e" stroke="#1d6b4a" stroke-width="1"/>
  <text x="380" y="138" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#5dcaa5">S3 + CloudFront</text>
  <text x="380" y="158" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#3a8a6a">React Frontend</text>
  <text x="380" y="174" text-anchor="middle" font-family="monospace" font-size="9" fill="#1d6b4a">HTTPS · Global CDN</text>

  <!-- API Gateway -->
  <rect x="280" y="200" width="200" height="72" rx="8" fill="#1a1030" stroke="#5347b7" stroke-width="1"/>
  <text x="380" y="228" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#afa9ec">API Gateway</text>
  <text x="380" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f77dd">POST /generate</text>
  <text x="380" y="264" text-anchor="middle" font-family="monospace" font-size="9" fill="#534ab7">REST · us-west-2</text>

  <!-- ── ROW 2: LAMBDA ── -->
  <rect x="540" y="155" width="200" height="90" rx="8" fill="#1a1030" stroke="#5347b7" stroke-width="1.5"/>
  <text x="640" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#afa9ec">Lambda</text>
  <text x="640" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f77dd">Python 3.12 Orchestrator</text>
  <text x="640" y="222" text-anchor="middle" font-family="monospace" font-size="9" fill="#534ab7">512MB · 60s timeout</text>
  <text x="640" y="238" text-anchor="middle" font-family="monospace" font-size="9" fill="#534ab7">Pillow · boto3</text>

  <!-- ── ROW 3: BEDROCK MODELS ── -->

  <!-- Claude Haiku -->
  <rect x="800" y="110" width="210" height="90" rx="8" fill="#2a140c" stroke="#993c1d" stroke-width="1"/>
  <text x="905" y="138" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#f09579">Bedrock — Claude</text>
  <text x="905" y="156" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#d85a30">Haiku 4.5 · global profile</text>
  <text x="905" y="174" text-anchor="middle" font-family="monospace" font-size="9" fill="#993c1d">Title + Image Prompt</text>
  <text x="905" y="190" text-anchor="middle" font-family="monospace" font-size="9" fill="#993c1d">~$0.001 / call</text>

  <!-- Stable Diffusion -->
  <rect x="800" y="220" width="210" height="90" rx="8" fill="#2a140c" stroke="#993c1d" stroke-width="1"/>
  <text x="905" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#f09579">Bedrock — SD 3.5</text>
  <text x="905" y="266" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#d85a30">Stable Diffusion 3.5 Large</text>
  <text x="905" y="284" text-anchor="middle" font-family="monospace" font-size="9" fill="#993c1d">1280×720 Background</text>
  <text x="905" y="300" text-anchor="middle" font-family="monospace" font-size="9" fill="#993c1d">~$0.04 / image</text>

  <!-- ── ROW 4: PILLOW + S3 ── -->

  <!-- Pillow Composite -->
  <rect x="540" y="380" width="200" height="90" rx="8" fill="#1a1030" stroke="#5347b7" stroke-width="1"/>
  <text x="640" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#afa9ec">Pillow</text>
  <text x="640" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f77dd">Text Composite</text>
  <text x="640" y="448" text-anchor="middle" font-family="monospace" font-size="9" fill="#534ab7">Gradient overlay</text>
  <text x="640" y="462" text-anchor="middle" font-family="monospace" font-size="9" fill="#534ab7">Bebas Neue · drop shadow</text>

  <!-- S3 Thumbnails -->
  <rect x="280" y="560" width="200" height="80" rx="8" fill="#0d2a1e" stroke="#1d6b4a" stroke-width="1"/>
  <text x="380" y="590" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#5dcaa5">S3 Bucket</text>
  <text x="380" y="610" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#3a8a6a">Thumbnail Storage</text>
  <text x="380" y="628" text-anchor="middle" font-family="monospace" font-size="9" fill="#1d6b4a">24hr auto-expiry</text>

  <!-- ── ARROWS ── -->

  <!-- User → CloudFront -->
  <line x1="210" y1="170" x2="278" y2="155" stroke="#666" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- User → API Gateway -->
  <line x1="210" y1="200" x2="278" y2="230" stroke="#666" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- API Gateway → Lambda -->
  <line x1="480" y1="236" x2="538" y2="210" stroke="#FF3B3B" stroke-width="1.5" marker-end="url(#arrow-red)"/>

  <!-- Lambda → Claude -->
  <line x1="740" y1="185" x2="798" y2="165" stroke="#d85a30" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Lambda → SD3.5 -->
  <line x1="740" y1="215" x2="798" y2="255" stroke="#d85a30" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Claude → Pillow (dashed, text prompt) -->
  <path d="M905 200 L905 350 L640 350 L640 378" fill="none" stroke="#d85a30" stroke-width="1" stroke-dasharray="5 3" marker-end="url(#arrow)"/>

  <!-- SD3.5 → Pillow -->
  <path d="M800 280 L750 280 L750 360 L640 360 L640 378" fill="none" stroke="#d85a30" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Pillow → S3 -->
  <path d="M580 470 L580 540 L380 540 L380 558" fill="none" stroke="#1d6b4a" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- S3 → User (presigned URL, dashed) -->
  <path d="M280 600 L145 600 L145 227" fill="none" stroke="#FFD600" stroke-width="1" stroke-dasharray="6 3" marker-end="url(#arrow)"/>

  <!-- Labels -->
  <text x="218" y="166" font-family="monospace" font-size="9" fill="#555">loads app</text>
  <text x="214" y="222" font-family="monospace" font-size="9" fill="#555">POST idea</text>
  <text x="490" y="215" font-family="monospace" font-size="9" fill="#FF3B3B">invokes</text>
  <text x="748" y="175" font-family="monospace" font-size="9" fill="#d85a30">text</text>
  <text x="748" y="260" font-family="monospace" font-size="9" fill="#d85a30">image</text>
  <text x="150" y="597" font-family="monospace" font-size="9" fill="#FFD600">presigned URL</text>

  <!-- ── STEP NUMBERS ── -->
  <circle cx="248" cy="192" r="12" fill="#FF3B3B"/>
  <text x="248" y="196" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#fff">1</text>

  <circle cx="510" cy="220" r="12" fill="#FF3B3B"/>
  <text x="510" y="224" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#fff">2</text>

  <circle cx="768" cy="190" r="12" fill="#FF3B3B"/>
  <text x="768" y="194" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#fff">3</text>

  <circle cx="598" cy="362" r="12" fill="#FF3B3B"/>
  <text x="598" y="366" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#fff">4</text>

  <circle cx="530" cy="528" r="12" fill="#FF3B3B"/>
  <text x="530" y="532" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#fff">5</text>

  <!-- ── LEGEND ── -->
  <rect x="800" y="400" width="400" height="260" rx="8" fill="#111" stroke="#222" stroke-width="1"/>
  <text x="820" y="425" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#666" letter-spacing="2">LEGEND</text>

  <rect x="820" y="440" width="12" height="12" rx="2" fill="#0d2a1e" stroke="#1d6b4a"/>
  <text x="840" y="451" font-family="Arial, sans-serif" font-size="11" fill="#5dcaa5">Frontend / Storage (S3, CloudFront)</text>

  <rect x="820" y="464" width="12" height="12" rx="2" fill="#1a1030" stroke="#5347b7"/>
  <text x="840" y="475" font-family="Arial, sans-serif" font-size="11" fill="#afa9ec">Compute (Lambda)</text>

  <rect x="820" y="488" width="12" height="12" rx="2" fill="#2a140c" stroke="#993c1d"/>
  <text x="840" y="499" font-family="Arial, sans-serif" font-size="11" fill="#f09579">AI Models (Bedrock)</text>

  <line x1="820" y1="520" x2="840" y2="520" stroke="#FF3B3B" stroke-width="1.5"/>
  <text x="848" y="524" font-family="Arial, sans-serif" font-size="11" fill="#666">Main request flow</text>

  <line x1="820" y1="544" x2="840" y2="544" stroke="#d85a30" stroke-width="1" stroke-dasharray="5 3"/>
  <text x="848" y="548" font-family="Arial, sans-serif" font-size="11" fill="#666">AI model calls</text>

  <line x1="820" y1="568" x2="840" y2="568" stroke="#FFD600" stroke-width="1" stroke-dasharray="5 3"/>
  <text x="848" y="572" font-family="Arial, sans-serif" font-size="11" fill="#666">Presigned URL return</text>

  <text x="820" y="600" font-family="monospace" font-size="10" fill="#444">Region: us-west-2 (Oregon)</text>
  <text x="820" y="618" font-family="monospace" font-size="10" fill="#444">Est. cost: ~$0.05 per thumbnail</text>
  <text x="820" y="636" font-family="monospace" font-size="10" fill="#444">Avg latency: 40–60 seconds</text>

  <!-- Live demo badge -->
  <rect x="800" y="660" width="400" height="36" rx="6" fill="#1a1030" stroke="#5347b7"/>
  <text x="1000" y="682" text-anchor="middle" font-family="monospace" font-size="10" fill="#7f77dd">🔗 https://d14773r3qlmfb6.cloudfront.net</text>
</svg>
